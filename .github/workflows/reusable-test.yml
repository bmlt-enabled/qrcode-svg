name: Reusable Tests

on:
    workflow_call:

permissions:
    contents: read

jobs:
    test-js:
        runs-on: ubuntu-24.04
        steps:
            - name: checkout 🛒
              uses: actions/checkout@v7
            - name: node 22 ❇️
              uses: actions/setup-node@v7
              with:
                  node-version: 22
            - name: install dependencies 📦
              run: npm ci
            - name: lint 🧹
              run: npm run lint
            - name: tests 🧪
              run: npm run test
            - name: build 📦
              run: npm run build
            - name: typecheck declarations 🔎
              run: npm run typecheck
