name: Deploy to Pages

on:
    push:
        branches: ['main']
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: 'pages'
    cancel-in-progress: false

jobs:
    tests:
        uses: ./.github/workflows/reusable-test.yml

    deploy:
        needs: [tests]
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
            - name: Install
              run: npm ci
            - name: Build
              run: npm run build
            - name: Stage site
              run: |
                  # Mirror the repo layout so the examples' relative
                  # "../dist/qrcode.js" import resolves under any base path
                  # (root, project path, or custom domain).
                  mkdir -p _site/examples
                  cp -r examples/. _site/examples/
                  cp -r dist _site/dist
                  printf '<!doctype html><meta http-equiv="refresh" content="0; url=examples/">\n' > _site/index.html
            - name: Setup Pages
              uses: actions/configure-pages@v6
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: '_site'
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
